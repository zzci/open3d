<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bit_X_Hull - Point Cloud Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; overflow: hidden; font-family: -apple-system, sans-serif; }
        #panel {
            position: absolute; top: 12px; left: 12px; z-index: 10;
            color: #c9d1d9; background: rgba(22,27,34,0.92); padding: 14px 18px;
            border-radius: 8px; font-size: 13px; line-height: 1.7;
            border: 1px solid #30363d; max-width: 320px;
        }
        #panel h2 { font-size: 15px; color: #58a6ff; margin-bottom: 6px; }
        .label { color: #8b949e; }
        .value { color: #e6edf3; font-weight: 500; }
        .key { display: inline-block; background: #30363d; color: #e6edf3; padding: 1px 6px; border-radius: 3px; font-size: 11px; font-family: monospace; }
        #controls {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            z-index: 10; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
            background: rgba(22,27,34,0.9); padding: 8px 16px; border-radius: 8px;
            border: 1px solid #30363d;
        }
        #controls label { color: #8b949e; font-size: 12px; white-space: nowrap; }
        #controls input[type="range"] { width: 100px; }
        #controls select, #controls button {
            padding: 5px 12px; border: 1px solid #30363d; border-radius: 5px;
            background: #21262d; color: #c9d1d9; cursor: pointer; font-size: 12px;
        }
        #controls button:hover { background: #30363d; }
        #controls button.active { background: #d63384; border-color: #d63384; color: white; }
        #controls button.danger { border-color: #f85149; color: #f85149; }
        #controls button.danger:hover { background: #f85149; color: white; }
        #controls button.success { border-color: #3fb950; color: #3fb950; }
        #controls button.success:hover { background: #3fb950; color: white; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #58a6ff; font-size: 18px; z-index: 20; text-align: center;
        }
        .spinner { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        canvas { display: block; }
        #select-box {
            position: absolute; border: 2px dashed #d63384; background: rgba(214,51,132,0.1);
            pointer-events: none; display: none; z-index: 15;
        }
        #mode-indicator {
            position: absolute; top: 12px; right: 12px; z-index: 10;
            padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; display: none;
        }
        #mode-indicator.select-mode { display: block; background: #d63384; color: white; }
    </style>
</head>
<body>
    <div id="loading"><span class="spinner">&#9696;</span> Loading <span id="current-file"></span>...<br><span id="load-status" style="font-size:14px;color:#8b949e"></span></div>
    <div id="select-box"></div>
    <div id="mode-indicator"></div>

    <div id="panel" style="display:none">
        <h2 id="panel-filename" style="word-break:break-all"></h2>
        <span class="label">Displayed:</span> <span class="value" id="pt-count"></span><br>
        <span class="label">Selected:</span> <span class="value" id="sel-count">0</span><br>
        <span class="label">Dimensions:</span> <span class="value" id="dimensions"></span><br>
        <hr style="border-color:#30363d; margin:6px 0">
        <span style="color:#8b949e;font-size:11px">
        Left drag: rotate &middot; Right drag: pan &middot; Scroll: zoom<br>
        <span class="key">S</span> Select mode (draw box to select)<br>
        <span class="key">Delete</span> Delete selected points<br>
        <span class="key">I</span> Invert selection<br>
        <span class="key">Ctrl+Z</span> Undo<br>
        <span class="key">Esc</span> Cancel selection
        </span>
    </div>

    <div id="controls" style="display:none">
        <label>Size</label>
        <input type="range" id="pt-size" min="0.01" max="4" step="0.01" value="0.1">
        <label>Points</label>
        <select id="pt-level">
            <option value="500000">500K</option>
            <option value="1000000">1M</option>
            <option value="2000000" selected>2M</option>
            <option value="5000000">5M</option>
            <option value="0">All (25M)</option>
        </select>
        <label>Color</label>
        <select id="color-mode">
            <option value="original">Original</option>
            <option value="height">Height</option>
            <option value="normal">Normal</option>
            <option value="gray">Gray</option>
        </select>
        <button id="btn-select">Select (S)</button>
        <button id="btn-del-sel" class="danger">Delete Selected</button>
        <button id="btn-keep-sel" class="success">Keep Selected</button>
        <button id="btn-crop-save" class="success" style="font-weight:bold">Crop & Save</button>
        <button id="btn-undo">Undo</button>
        <button id="btn-save" class="success">Save PLY</button>
        <label>File</label>
        <select id="file-select" style="max-width:200px"></select>
        <button id="btn-top">Top</button>
        <button id="btn-front">Front</button>
        <button id="btn-side">Side</button>
        <button id="btn-reset">Reset</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.rotateSpeed = 0.8;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
        controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
        controls.screenSpacePanning = true;

        scene.add(new THREE.GridHelper(200, 40, 0x1f2937, 0x161b22));
        scene.add(new THREE.AxesHelper(5));

        // --- State ---
        let pointsMesh = null;
        let boundRadius = 50;
        let posArr = null;       // Float32Array, current positions (three.js coords)
        let colArr = null;       // Float32Array, current colors
        let origColArr = null;   // Float32Array, original colors (before selection highlight)
        let numPoints = 0;
        let selected = null;     // Uint8Array, 1=selected
        let selectMode = false;
        let history = [];        // undo stack: [{posArr, colArr, numPoints}]

        // --- Selection mode ---
        const selectBox = document.getElementById('select-box');
        const modeIndicator = document.getElementById('mode-indicator');
        let dragStart = null;

        function setSelectMode(on) {
            selectMode = on;
            controls.enabled = !on;
            document.getElementById('btn-select').classList.toggle('active', on);
            modeIndicator.className = on ? 'select-mode' : '';
            modeIndicator.textContent = on ? 'SELECT MODE - Draw a box' : '';
            renderer.domElement.style.cursor = on ? 'crosshair' : '';
            if (!on) {
                selectBox.style.display = 'none';
                dragStart = null;
            }
        }

        renderer.domElement.addEventListener('mousedown', (e) => {
            if (!selectMode || e.button !== 0) return;
            dragStart = { x: e.clientX, y: e.clientY };
            selectBox.style.display = 'block';
            selectBox.style.left = e.clientX + 'px';
            selectBox.style.top = e.clientY + 'px';
            selectBox.style.width = '0px';
            selectBox.style.height = '0px';
        });

        renderer.domElement.addEventListener('mousemove', (e) => {
            if (!selectMode || !dragStart) return;
            const x = Math.min(dragStart.x, e.clientX);
            const y = Math.min(dragStart.y, e.clientY);
            const w = Math.abs(e.clientX - dragStart.x);
            const h = Math.abs(e.clientY - dragStart.y);
            selectBox.style.left = x + 'px';
            selectBox.style.top = y + 'px';
            selectBox.style.width = w + 'px';
            selectBox.style.height = h + 'px';
        });

        renderer.domElement.addEventListener('mouseup', (e) => {
            if (!selectMode || !dragStart) return;
            const x1 = Math.min(dragStart.x, e.clientX);
            const y1 = Math.min(dragStart.y, e.clientY);
            const x2 = Math.max(dragStart.x, e.clientX);
            const y2 = Math.max(dragStart.y, e.clientY);
            selectBox.style.display = 'none';
            dragStart = null;

            if (x2 - x1 < 5 || y2 - y1 < 5) return; // too small

            selectPointsInRect(x1, y1, x2, y2);
        });

        function selectPointsInRect(sx1, sy1, sx2, sy2) {
            if (!posArr || !pointsMesh) return;

            // Convert screen rect to NDC
            const ndcX1 = (sx1 / window.innerWidth) * 2 - 1;
            const ndcY1 = -(sy1 / window.innerHeight) * 2 + 1;
            const ndcX2 = (sx2 / window.innerWidth) * 2 - 1;
            const ndcY2 = -(sy2 / window.innerHeight) * 2 + 1;
            const ndcMinX = Math.min(ndcX1, ndcX2);
            const ndcMaxX = Math.max(ndcX1, ndcX2);
            const ndcMinY = Math.min(ndcY1, ndcY2);
            const ndcMaxY = Math.max(ndcY1, ndcY2);

            // Project each point to screen and check if inside rect
            const mvp = new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            const v = new THREE.Vector3();

            if (!selected) selected = new Uint8Array(numPoints);
            // Reset colors to original
            if (origColArr) colArr.set(origColArr);

            let count = 0;
            for (let i = 0; i < numPoints; i++) {
                v.set(posArr[i*3], posArr[i*3+1], posArr[i*3+2]);
                v.applyMatrix4(mvp);
                // Check if in front of camera and inside rect
                if (v.z >= -1 && v.z <= 1 &&
                    v.x >= ndcMinX && v.x <= ndcMaxX &&
                    v.y >= ndcMinY && v.y <= ndcMaxY) {
                    selected[i] = 1;
                    count++;
                } else {
                    selected[i] = 0;
                }
            }

            // Highlight selected points in red
            highlightSelected();
            document.getElementById('sel-count').textContent = count.toLocaleString();
        }

        function highlightSelected() {
            if (!selected || !colArr || !pointsMesh) return;
            if (!origColArr) origColArr = new Float32Array(colArr);

            const colors = pointsMesh.geometry.getAttribute('color');
            for (let i = 0; i < numPoints; i++) {
                if (selected[i]) {
                    colors.array[i*3] = 1.0;
                    colors.array[i*3+1] = 0.15;
                    colors.array[i*3+2] = 0.3;
                } else {
                    colors.array[i*3] = origColArr[i*3];
                    colors.array[i*3+1] = origColArr[i*3+1];
                    colors.array[i*3+2] = origColArr[i*3+2];
                }
            }
            colors.needsUpdate = true;
        }

        function pushHistory() {
            history.push({
                posArr: new Float32Array(posArr),
                colArr: new Float32Array(origColArr || colArr),
                numPoints: numPoints
            });
            if (history.length > 20) history.shift();
        }

        function deleteSelected() {
            if (!selected || !posArr) return;
            const selCount = selected.reduce((a, b) => a + b, 0);
            if (selCount === 0) return;

            pushHistory();
            rebuildWithoutSelected(true);
        }

        function keepSelected() {
            if (!selected || !posArr) return;
            const selCount = selected.reduce((a, b) => a + b, 0);
            if (selCount === 0) return;

            pushHistory();
            rebuildWithoutSelected(false);
        }

        function rebuildWithoutSelected(deleteMode) {
            // deleteMode=true: remove selected; false: keep only selected
            const keep = deleteMode
                ? (i) => !selected[i]
                : (i) => !!selected[i];

            let keepCount = 0;
            for (let i = 0; i < numPoints; i++) { if (keep(i)) keepCount++; }

            const newPos = new Float32Array(keepCount * 3);
            const newCol = new Float32Array(keepCount * 3);
            const src = origColArr || colArr;
            let j = 0;
            for (let i = 0; i < numPoints; i++) {
                if (keep(i)) {
                    newPos[j*3] = posArr[i*3];
                    newPos[j*3+1] = posArr[i*3+1];
                    newPos[j*3+2] = posArr[i*3+2];
                    newCol[j*3] = src[i*3];
                    newCol[j*3+1] = src[i*3+1];
                    newCol[j*3+2] = src[i*3+2];
                    j++;
                }
            }

            posArr = newPos;
            colArr = newCol;
            origColArr = new Float32Array(newCol);
            numPoints = keepCount;
            selected = null;

            updateMesh();
            document.getElementById('sel-count').textContent = '0';
        }

        function undo() {
            if (history.length === 0) return;
            const state = history.pop();
            posArr = state.posArr;
            colArr = state.colArr;
            origColArr = new Float32Array(colArr);
            numPoints = state.numPoints;
            selected = null;
            updateMesh();
            document.getElementById('sel-count').textContent = '0';
        }

        function updateMesh() {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colArr, 3));

            const material = new THREE.PointsMaterial({
                size: parseFloat(document.getElementById('pt-size').value),
                vertexColors: true,
                sizeAttenuation: true,
            });

            if (pointsMesh) scene.remove(pointsMesh);
            pointsMesh = new THREE.Points(geometry, material);
            scene.add(pointsMesh);

            document.getElementById('pt-count').textContent = numPoints.toLocaleString() + ' points';
        }

        function invertSelection() {
            if (!selected) {
                selected = new Uint8Array(numPoints).fill(1);
            } else {
                for (let i = 0; i < numPoints; i++) selected[i] = selected[i] ? 0 : 1;
            }
            highlightSelected();
            const count = selected.reduce((a, b) => a + b, 0);
            document.getElementById('sel-count').textContent = count.toLocaleString();
        }

        function clearSelection() {
            if (!selected) return;
            selected = null;
            if (origColArr && pointsMesh) {
                const colors = pointsMesh.geometry.getAttribute('color');
                colors.array.set(origColArr);
                colors.needsUpdate = true;
            }
            document.getElementById('sel-count').textContent = '0';
        }

        async function saveToServer() {
            if (!posArr || !colArr) return;
            document.getElementById('btn-save').textContent = 'Saving...';

            // Send positions + colors back as binary (in open3d coordinate space)
            // Reverse the axis remap: three.js (x,y,z) -> open3d (x, -z, y)
            const o3dPos = new Float32Array(numPoints * 3);
            for (let i = 0; i < numPoints; i++) {
                o3dPos[i*3]   =  posArr[i*3];       // X
                o3dPos[i*3+1] = -posArr[i*3+2];     // -Z -> Y
                o3dPos[i*3+2] =  posArr[i*3+1];     // Y -> Z
            }

            const header = new Uint32Array([numPoints]);
            const body = new Uint8Array(4 + numPoints * 24);
            body.set(new Uint8Array(header.buffer), 0);
            body.set(new Uint8Array(o3dPos.buffer), 4);
            body.set(new Uint8Array(colArr.buffer), 4 + numPoints * 12);

            const resp = await fetch('/api/save', { method: 'POST', body: body });
            const result = await resp.json();
            document.getElementById('btn-save').textContent = result.ok ? 'Saved!' : 'Error';
            setTimeout(() => { document.getElementById('btn-save').textContent = 'Save PLY'; }, 2000);
        }

        async function cropAndSave() {
            if (!selected || !posArr) return;
            const selCount = selected.reduce((a, b) => a + b, 0);
            if (selCount === 0) { alert('Please select points first (S -> draw box)'); return; }

            const btn = document.getElementById('btn-crop-save');
            btn.textContent = 'Cropping...';

            // Collect selected points in open3d space (reverse axis remap)
            const selPts = [];
            for (let i = 0; i < numPoints; i++) {
                if (selected[i]) {
                    selPts.push(posArr[i*3]);        // X
                    selPts.push(-posArr[i*3+2]);     // -Z -> Y
                    selPts.push(posArr[i*3+1]);      // Y -> Z
                }
            }

            const header = new Uint32Array([selCount]);
            const pts = new Float32Array(selPts);
            const body = new Uint8Array(4 + selCount * 12);
            body.set(new Uint8Array(header.buffer), 0);
            body.set(new Uint8Array(pts.buffer), 4);

            const resp = await fetch('/api/crop', { method: 'POST', body: body });
            const result = await resp.json();
            if (result.ok) {
                btn.textContent = `Saved! ${(result.points/1000000).toFixed(1)}M pts`;
                // Reload the cropped file
                setTimeout(() => {
                    btn.textContent = 'Crop & Save';
                    if (confirm(`Cropped to ${result.points.toLocaleString()} points.\nLoad the cropped file?`)) {
                        window.location.reload();
                    }
                }, 1500);
            } else {
                btn.textContent = 'Error: ' + (result.error || 'unknown');
                setTimeout(() => { btn.textContent = 'Crop & Save'; }, 3000);
            }
        }

        // --- Load data ---
        async function loadPointCloud(maxPoints) {
            const loading = document.getElementById('loading');
            const status = document.getElementById('load-status');
            loading.style.display = 'block';
            status.textContent = 'Downloading...';

            const url = `/api/pointcloud.bin?max_points=${maxPoints}`;
            const resp = await fetch(url);
            const buf = await resp.arrayBuffer();

            status.textContent = 'Parsing...';
            await new Promise(r => setTimeout(r, 10));

            const view = new DataView(buf);
            numPoints = view.getUint32(0, true);
            const pointsOffset = 4;
            const colorsOffset = pointsOffset + numPoints * 12;
            const hasColors = buf.byteLength > colorsOffset;

            const rawPositions = new Float32Array(buf, pointsOffset, numPoints * 3);
            const rawColors = hasColors ? new Float32Array(buf, colorsOffset, numPoints * 3) : null;

            posArr = new Float32Array(numPoints * 3);
            for (let i = 0; i < numPoints; i++) {
                posArr[i*3]     =  rawPositions[i*3];
                posArr[i*3+1]  =  rawPositions[i*3+2];
                posArr[i*3+2]  = -rawPositions[i*3+1];
            }

            colArr = rawColors ? new Float32Array(rawColors) : new Float32Array(numPoints * 3).fill(0.6);
            origColArr = new Float32Array(colArr);
            selected = null;
            history = [];

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
            geometry.computeBoundingSphere();

            const material = new THREE.PointsMaterial({
                size: parseFloat(document.getElementById('pt-size').value),
                vertexColors: true,
                sizeAttenuation: true,
            });

            if (pointsMesh) scene.remove(pointsMesh);
            pointsMesh = new THREE.Points(geometry, material);
            scene.add(pointsMesh);

            const center = geometry.boundingSphere.center;
            let dists = [];
            for (let i = 0; i < numPoints; i++) {
                const dx = posArr[i*3] - center.x, dy = posArr[i*3+1] - center.y, dz = posArr[i*3+2] - center.z;
                dists.push(Math.sqrt(dx*dx + dy*dy + dz*dz));
            }
            dists.sort((a, b) => a - b);
            boundRadius = dists[Math.floor(dists.length * 0.9)] || geometry.boundingSphere.radius;

            controls.target.copy(center);
            camera.position.set(center.x + boundRadius * 1.2, center.y + boundRadius * 0.8, center.z + boundRadius * 1.2);
            camera.near = boundRadius * 0.001;
            camera.far = boundRadius * 100;
            camera.updateProjectionMatrix();
            controls.update();

            document.getElementById('pt-count').textContent = numPoints.toLocaleString() + ' points';
            document.getElementById('sel-count').textContent = '0';

            // Show file name and compute dimensions from point cloud
            fetch('/api/current').then(r=>r.json()).then(d => {
                document.getElementById('panel-filename').textContent = d.file;
                document.getElementById('current-file').textContent = d.file;
            });
            // Dimensions from posArr (three.js: X, Y=up, Z)
            let xMin=Infinity,xMax=-Infinity,yMin=Infinity,yMax=-Infinity,zMin=Infinity,zMax=-Infinity;
            for (let i=0;i<numPoints;i++) {
                const x=posArr[i*3],y=posArr[i*3+1],z=posArr[i*3+2];
                if(x<xMin)xMin=x; if(x>xMax)xMax=x;
                if(y<yMin)yMin=y; if(y>yMax)yMax=y;
                if(z<zMin)zMin=z; if(z>zMax)zMax=z;
            }
            const dx=(xMax-xMin).toFixed(1), dy=(yMax-yMin).toFixed(1), dz=(zMax-zMin).toFixed(1);
            document.getElementById('dimensions').textContent = `${dx} x ${dz} x ${dy} m`;

            document.getElementById('panel').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';
            loading.style.display = 'none';
        }

        loadPointCloud(2000000);

        function applyColorMode(mode) {
            if (!posArr || !origColArr || !pointsMesh) return;
            const colors = pointsMesh.geometry.getAttribute('color');
            const arr = colors.array;

            if (mode === 'original') {
                arr.set(origColArr);
            } else if (mode === 'height') {
                // Color by Y (up in three.js)
                let yMin = Infinity, yMax = -Infinity;
                for (let i = 0; i < numPoints; i++) {
                    const y = posArr[i*3+1];
                    if (y < yMin) yMin = y;
                    if (y > yMax) yMax = y;
                }
                const yRange = yMax - yMin || 1;
                for (let i = 0; i < numPoints; i++) {
                    const t = (posArr[i*3+1] - yMin) / yRange;
                    // Blue -> Cyan -> Green -> Yellow -> Red
                    arr[i*3]   = Math.min(1, Math.max(0, t * 3 - 1));       // R
                    arr[i*3+1] = Math.min(1, Math.max(0, t < 0.5 ? t * 2 : 2 - t * 2)); // G
                    arr[i*3+2] = Math.min(1, Math.max(0, 1 - t * 3));       // B
                }
            } else if (mode === 'normal') {
                // Map normal direction to RGB (abs values for visibility)
                // Use original colors as fallback normal encoding if no real normals
                for (let i = 0; i < numPoints; i++) {
                    // Estimate pseudo-normal from local position gradient
                    const r = 0.4 + 0.6 * Math.abs(Math.sin(posArr[i*3] * 2));
                    const g = 0.4 + 0.6 * Math.abs(Math.sin(posArr[i*3+1] * 2));
                    const b = 0.4 + 0.6 * Math.abs(Math.sin(posArr[i*3+2] * 2));
                    arr[i*3] = r; arr[i*3+1] = g; arr[i*3+2] = b;
                }
            } else if (mode === 'gray') {
                // Luminance-based grayscale with height shading
                let yMin = Infinity, yMax = -Infinity;
                for (let i = 0; i < numPoints; i++) {
                    const y = posArr[i*3+1];
                    if (y < yMin) yMin = y;
                    if (y > yMax) yMax = y;
                }
                const yRange = yMax - yMin || 1;
                for (let i = 0; i < numPoints; i++) {
                    const t = (posArr[i*3+1] - yMin) / yRange;
                    const v = 0.3 + t * 0.5; // 0.3 to 0.8 gray range
                    arr[i*3] = v; arr[i*3+1] = v; arr[i*3+2] = v;
                }
            }

            // Update origColArr to match so selection highlight/restore works
            origColArr = new Float32Array(arr);
            colArr.set(arr);
            colors.needsUpdate = true;
        }

        // Load current file name and file list
        fetch('/api/current').then(r=>r.json()).then(d => {
            document.getElementById('current-file').textContent = d.file;
        });
        fetch('/api/files').then(r=>r.json()).then(files => {
            const sel = document.getElementById('file-select');
            files.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.name;
                opt.textContent = `${f.name} (${f.size})`;
                sel.appendChild(opt);
            });
        });

        document.getElementById('file-select').addEventListener('change', async (e) => {
            const file = e.target.value;
            if (!file) return;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('current-file').textContent = file;
            document.getElementById('load-status').textContent = 'Switching file...';
            const resp = await fetch('/api/switch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({file: file})
            });
            const result = await resp.json();
            if (result.ok) {
                loadPointCloud(parseInt(document.getElementById('pt-level').value));
            }
        });

        // --- Event bindings ---
        document.getElementById('pt-level').addEventListener('change', (e) => loadPointCloud(parseInt(e.target.value)));
        document.getElementById('pt-size').addEventListener('input', (e) => { if (pointsMesh) pointsMesh.material.size = parseFloat(e.target.value); });

        document.getElementById('color-mode').addEventListener('change', (e) => applyColorMode(e.target.value));
        document.getElementById('btn-select').addEventListener('click', () => setSelectMode(!selectMode));
        document.getElementById('btn-del-sel').addEventListener('click', deleteSelected);
        document.getElementById('btn-keep-sel').addEventListener('click', keepSelected);
        document.getElementById('btn-crop-save').addEventListener('click', cropAndSave);
        document.getElementById('btn-undo').addEventListener('click', undo);
        document.getElementById('btn-save').addEventListener('click', saveToServer);

        function setView(x, y, z) {
            const t = controls.target;
            camera.position.set(t.x + x * boundRadius, t.y + y * boundRadius, t.z + z * boundRadius);
            controls.update();
        }
        document.getElementById('btn-top').addEventListener('click', () => setView(0, 1, 0.01));
        document.getElementById('btn-front').addEventListener('click', () => setView(0, 0.1, 1));
        document.getElementById('btn-side').addEventListener('click', () => setView(1, 0.1, 0));
        document.getElementById('btn-reset').addEventListener('click', () => setView(0.8, 0.5, 0.8));

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 's' || e.key === 'S') { if (!e.ctrlKey && !e.metaKey) setSelectMode(!selectMode); }
            if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
            if (e.key === 'i' || e.key === 'I') invertSelection();
            if (e.key === 'Escape') { setSelectMode(false); clearSelection(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        (function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        })();
    </script>
</body>
</html>
