name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROJECT_NAME: 3d-ds-cc

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Ensure Pages project exists
        run: |
          if npx wrangler pages project get "$PROJECT_NAME" >/dev/null 2>&1; then
            echo "Project already exists"
          else
            echo "Project not found, creating..."
            npx wrangler pages project create "$PROJECT_NAME" --production-branch=zzci/open3d
          fi

      - name: Deploy
        run: npx wrangler pages deploy apps/web/dist --project-name="$PROJECT_NAME" --commit-dirty=true
